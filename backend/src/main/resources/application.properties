# Server Configuration
server.port=8080

# Spring Application
spring.application.name=floci-aws-backend

# Datasource (AWS RDS PostgreSQL Database via Floci)
spring.datasource.url=jdbc:postgresql://localhost:7001/floci_ui
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=floci_ui
spring.datasource.password=1100

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Application JWT Security
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# AWS S3 Configuration (Floci Local Emulator)
aws.s3.bucket=floci-uploads
aws.endpoint=http://localhost:4566
aws.region=us-east-1
aws.accessKeyId=test
aws.secretAccessKey=test

# Spring Servlet Multipart File Upload (up to 25MB)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

