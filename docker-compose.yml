services:
  floci:
    image: floci/floci:latest
    container_name: floci-aws
    ports:
      - "4566:4566"           # Main Floci AWS API
      - "4500:4500"           # Floci Web Dashboard
      - "7001-7010:7001-7010" # AWS RDS Database Proxy Ports
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./floci-data:/app/data
    environment:
      - SERVICES=rds
      - FLOCI_STORAGE_MODE=persistent
      - FLOCI_STORAGE_PERSISTENT_PATH=/app/data
    restart: unless-stopped

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: floci-pgweb
    ports:
      - "8081:8081"           # Web Database Browser GUI
    command: ["pgweb", "--bind=0.0.0.0", "--listen=8081", "--host=172.17.0.1", "--port=7001", "--user=floci_ui", "--pass=1100", "--db=floci_ui", "--ssl=disable"]
    restart: unless-stopped
